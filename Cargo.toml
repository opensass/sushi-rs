[package]
name = "sushi-rs"
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
description = "🍣 A highly customizable SVG sushi component for WASM frameworks like Yew, Dioxus, and Leptos."
license = "MIT"
keywords = ["sushi", "yew", "rust", "dioxus", "leptos"]
categories = ["web-programming", "gui"]
repository = "https://github.com/opensass/sushi-rs"
documentation = "https://docs.rs/sushi-rs"
authors = ["Mahmoud Harmouch <oss@wiseai.dev>"]
exclude = ["/assets", "/examples"]

[dependencies]
yew = { version = "0.23.0", default-features = false, optional = true }
dioxus = { version = "0.7.10", optional = true }
leptos = { version = "0.8.20", optional = true }
web-sys = { version = "0.3.104", optional = true }
strum_macros = "0.28.0"
strum = "0.28.0"
log = { version = "0.4.33", optional = true }
dioxus-logger = { version = "0.7.10", optional = true }

[features]
yew = ["dep:yew", "log", "web-sys"]
dio = ["dioxus", "dioxus-logger"]
lep = ["leptos"]

[profile.release]
opt-level = "z"
debug = false
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

[badges]
maintenance = { status = "actively-developed" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
bump2version = "0.1.6"
